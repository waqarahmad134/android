# =============================================================================
# Multi-Exchange Trading Bot — configuration
# =============================================================================

# "paper" = simulated fills, no real orders (SAFE DEFAULT).
# "live"  = places real orders. Requires API keys in .env. Read the README first.
mode: paper

# Which exchange to route live/paper market data and orders through.
# One of: binance, kucoin, bybit
exchange: binance

# Use the exchange testnet/sandbox endpoint when available (live mode only).
use_sandbox: true

# Quote currency the bot accounts in and parks idle capital in.
quote_currency: USDT

# Starting equity for paper trading / backtests (units of quote_currency).
paper_starting_equity: 10000

# -----------------------------------------------------------------------------
# Asset universe — the "safer" instruments the bot is allowed to trade.
# These crypto venues do not list real equities or physical metals; the closest
# safer instruments are large-cap majors and tokenized gold/silver.
# -----------------------------------------------------------------------------
universe:
  - BTC/USDT      # deepest liquidity, lowest slippage
  - ETH/USDT      # second-deepest major
  - BNB/USDT      # large-cap exchange token
  - SOL/USDT      # high-liquidity major
  - XRP/USDT      # large-cap major
  - ADA/USDT      # large-cap major
  - PAXG/USDT     # Pax Gold — 1 token ≈ 1 oz gold (tokenized commodity)
  # - XAUT/USDT   # Tether Gold (enable if listed on your exchange)
  # - LTC/USDT
  # - DOGE/USDT
  # Add/remove freely — prefer top-cap, high-liquidity pairs to minimize slippage.

# How often the trading loop wakes up to evaluate signals.
timeframe: 1h            # candle size used for signals
poll_interval_seconds: 300

# -----------------------------------------------------------------------------
# Strategy selection. One of: ema_crossover, rsi_mean_reversion, momentum, ensemble
# "ensemble" combines the others and only acts on majority agreement.
# This `strategy` is the default/fallback; fine-grained control is below.
# -----------------------------------------------------------------------------
strategy: ensemble

# Multi-strategy control — pick how a strategy is chosen per coin:
#   single  : use `default` for every coin.
#   routing : use the explicit map below (set it by hand, or generate it with
#             `python -m src.main evaluate` and "Apply recommendation" in the UI).
#   auto    : adaptive — pick the best live performer per coin once enough trades
#             exist, else the backtest recommendation, else `default`.
strategy_selection:
  # 'auto' suits the demo week: it learns the best strategy per coin from results
  # (seed it first with `python -m src.main evaluate`). Use 'single' for one
  # strategy everywhere, or 'routing' for an explicit per-coin map.
  mode: auto               # single | routing | auto
  default: ensemble
  routing:                 # used when mode: routing
    default: ensemble
    # BTC/USDT: ema_crossover
    # PAXG/USDT: rsi_mean_reversion
  auto:                    # used when mode: auto
    min_trades: 5          # live trades before trusting a strategy for a coin
    metric: total_pnl      # total_pnl | win_rate | avg_pnl

strategy_params:
  ema_crossover:
    fast: 12
    slow: 26
  rsi_mean_reversion:
    period: 14
    oversold: 30
    overbought: 70
  momentum:
    lookback: 24
    threshold_pct: 1.5
  ensemble:
    min_agreement: 2   # need >= 2 sub-strategies agreeing to act

# -----------------------------------------------------------------------------
# Risk management — capital preservation comes first.
# -----------------------------------------------------------------------------
risk:
  max_position_pct: 0.15        # max fraction of equity in a single position
  max_total_exposure_pct: 0.60  # max fraction of equity deployed across all positions
  max_open_positions: 4
  stop_loss_pct: 0.02           # hard stop: exit if position drops 2%
  take_profit_pct: 0.04         # take profit at +4% (2:1 reward:risk)
  trailing_stop_pct: 0.015      # trail the stop once in profit
  daily_loss_limit_pct: 0.03    # circuit breaker: halt for the day after -3% equity
  per_trade_risk_pct: 0.01      # risk at most 1% of equity per trade (sizing)

# -----------------------------------------------------------------------------
# Compounding — reinvest profits by sizing off *current* equity, not the start.
# -----------------------------------------------------------------------------
compounding:
  enabled: true
  # Optional: skim a fraction of realized profit into a "safe" reserve that the
  # bot will not trade, locking in gains. 0 = reinvest everything.
  profit_reserve_pct: 0.20

# -----------------------------------------------------------------------------
# Notifications — get pinged on every trade / circuit-breaker event.
# Slack uses an Incoming Webhook (reliable globally; no app store needed).
# Put the webhook URL in SLACK_WEBHOOK_URL in your .env.
# -----------------------------------------------------------------------------
notifications:
  enabled: false           # set true and add SLACK_WEBHOOK_URL to .env
  provider: slack
  username: trading-bot
  # min_level: which events to push. info = everything incl. heartbeats,
  # trade = entries/exits + alerts, alert = only circuit-breaker/critical.
  min_level: trade
  # Auto-send the readiness report to Slack every N hours (0 = off).
  # 24 = daily, 168 = weekly. Great for the demo week.
  report_every_hours: 0

logging:
  level: INFO
  file: logs/bot.log
