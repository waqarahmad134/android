# Run the bot 24/7:  docker compose up -d   (then `docker compose logs -f`)
#
# Safe by default: paper mode, no real orders. To go live, edit
# config/config.yaml (mode: live) and provide API keys in .env.
services:
  trading-bot:
    build: .
    image: multi-exchange-trading-bot:latest
    container_name: trading-bot
    restart: unless-stopped          # auto-recover from crashes / reboots
    env_file:
      - .env                         # API keys + SLACK_WEBHOOK_URL
    volumes:
      - ./config:/app/config:ro      # edit config without rebuilding
      - ./logs:/app/logs             # persist logs on the host
    # Resource guardrails (optional — tune to your host).
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Web dashboard + admin settings — open http://localhost:8000
  # Reads bot state; admin settings can edit config/.env (gated by ADMIN_TOKEN).
  dashboard:
    build: .
    image: multi-exchange-trading-bot:latest
    container_name: trading-bot-dashboard
    restart: unless-stopped
    command: ["dashboard", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env                      # provides ADMIN_TOKEN, SLACK_WEBHOOK_URL, keys
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs:ro       # reads state + evaluation results
      - ./config:/app/config      # rw so Settings can persist config edits
      - ./.env:/app/.env          # rw so Settings can persist API keys
    depends_on:
      - trading-bot
